<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每日接龙 · 社区共创小说</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <h1 id="story-title">每日接龙</h1>
      <p class="tagline">每天一个回合，社区共同决定故事的下一步</p>
    </div>
    <div id="auth-bar" class="auth-bar">
      <form id="login-form" class="auth-form">
        <input id="username" name="username" placeholder="用户名" autocomplete="username" required>
        <input id="password" name="password" type="password" placeholder="密码" autocomplete="current-password" required>
        <button type="submit" id="login-btn">登录</button>
        <button type="button" id="register-btn">注册</button>
      </form>
      <div id="user-box" class="user-box" hidden>
        <span id="user-name"></span>
        <button type="button" id="logout-btn">退出</button>
      </div>
    </div>
  </header>

  <p id="banner" class="banner" hidden></p>

  <main class="layout">
    <section class="card" id="story-card">
      <h2>故事正文</h2>
      <article id="story-text" class="story-text"></article>
    </section>

    <section class="card" id="round-card">
      <h2>今日续写 · <span id="day-label">Day ?</span></h2>
      <p class="round-meta">
        <span id="countdown">距离本回合结束：--:--:--</span>
        <span id="status-line"></span>
      </p>
      <div id="compose">
        <textarea id="content" rows="5" placeholder="写下这一段续写（80–300 字）"></textarea>
        <div class="compose-bar">
          <span id="char-count">0 / 300</span>
          <button id="submit-btn">提交续写</button>
        </div>
      </div>
      <p id="closed-note" class="note" hidden>本回合已结束，正在结算最终结果……</p>
    </section>

    <section class="card" id="subs-card">
      <h2>今日投稿</h2>
      <p id="empty-note" class="note" hidden>今天还没有投稿，来写下第一段吧。</p>
      <ul id="sub-list" class="sub-list"></ul>
    </section>
  </main>

  <footer class="site-footer">投票最高的投稿将在 24:00 成为 Canon，故事由此继续。</footer>
  <script src="/app.js"></script>
</body>
</html>
